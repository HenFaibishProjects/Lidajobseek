<header *ngIf="isAuthenticated" class="app-navbar">

    <!-- ═══ Logo ═══ -->
    <div class="navbar-logo-zone">
        <a class="app-logo" routerLink="/">
            <div class="logo-icon">
                <img src="assets/logo.png" alt="Reqcue Logo" class="logo-image" />
            </div>
            <div class="logo-content">
                <span class="logo-text">Reqcue</span>
                <span class="logo-tagline">Your next move in every job process</span>
            </div>
        </a>
    </div>

    <!-- ═══ Desktop Nav (all items) ═══ -->
    <nav class="navbar-links" aria-label="Primary navigation">
        <div class="nav-group">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item"
                title="Dashboard [D]">
                <span class="nav-icon-wrap">
                    <img src="assets/icons/dashaboard.png" width="18" height="18" alt="Dashboard icon">
                </span>
                <span class="nav-label"><span class="shortcut-hint">D</span>ashboard</span>
                <span class="nav-pip"></span>
            </a>

            <a routerLink="/pipeline" routerLinkActive="active" class="nav-item" title="Pipeline [P]">
                <span class="nav-icon-wrap">
                    <img src="assets/icons/pipe.png" width="18" height="18" alt="Pipeline icon">
                </span>
                <span class="nav-label"><span class="shortcut-hint">P</span>ipeline</span>
                <span class="nav-pip"></span>
            </a>

            <a routerLink="/calendar" routerLinkActive="active" class="nav-item" title="Calendar [C]">
                <span class="nav-icon-wrap">
                    <img src="assets/icons/calender.png" width="18" height="18" alt="Calendar icon">
                </span>
                <span class="nav-label"><span class="shortcut-hint">C</span>alendar</span>
                <span class="nav-pip"></span>
            </a>

            <a routerLink="/recruiters" routerLinkActive="active" class="nav-item" title="Recruiters [R]">
                <span class="nav-icon-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                <span class="nav-label"><span class="shortcut-hint">R</span>ecruiters</span>
                <span class="nav-pip"></span>
            </a>

            <a routerLink="/analytics" routerLinkActive="active" class="nav-item" title="Analytics [A]">
                <span class="nav-icon-wrap">
                    <img src="assets/icons/analitics.png" width="18" height="18" alt="Analytics icon">
                </span>
                <span class="nav-label"><span class="shortcut-hint">A</span>nalytics</span>
                <span class="nav-pip"></span>
            </a>

            <a routerLink="/coach-hub" routerLinkActive="active" class="nav-item" title="Coach Hub [H]">
                <span class="nav-icon-wrap">
                    <img src="assets/icons/hub.png" width="18" height="18" alt="Coach Hub icon">
                </span>
                <span class="nav-label">Coach <span class="shortcut-hint">H</span>ub</span>
                <span class="nav-pip"></span>
            </a>

            

        </div>
    </nav>

    <!-- ═══ Right Actions ═══ -->
    <div class="navbar-actions">
        <button class="action-btn settings-btn" type="button" title="Settings" (click)="toggleSettings.emit()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24">
                </path>
            </svg>
            <span class="action-label">Settings</span>
        </button>
        <button class="action-btn logout-btn" type="button" title="Log out" (click)="logout.emit()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="action-label">Logout</span>
        </button>

        <!-- Hamburger -ONLY tablet/mobile -->
        <button class="hamburger-btn" type="button" [class.open]="drawerOpen" (click)="toggleDrawer()"
            aria-label="Toggle menu" [attr.aria-expanded]="drawerOpen">
            <span class="ham-line"></span>
            <span class="ham-line"></span>
            <span class="ham-line"></span>
        </button>
    </div>
</header>

<!-- ═══ Drawer overlay ═══ -->
<div *ngIf="isAuthenticated" class="drawer-overlay" [class.open]="drawerOpen" (click)="closeDrawer()"
    aria-hidden="true"></div>

<!-- ═══ Slide-over Drawer (tablet + mobile only) ═══ -->
<aside *ngIf="isAuthenticated" class="nav-drawer" [class.open]="drawerOpen" aria-label="Navigation drawer">

    <div class="drawer-header">
        <a class="drawer-logo" routerLink="/" (click)="closeDrawer()">
            <div class="logo-icon">
                <img src="assets/logo.png" alt="Reqcue Logo" class="logo-image" />
            </div>
            <div class="logo-content">
                <span class="logo-text">ReqCue - Your next move in every job process</span>
                <span class="logo-tagline">Your Career Tracker</span>
            </div>
        </a>
        <button class="drawer-close" (click)="closeDrawer()" aria-label="Close menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <nav class="drawer-nav">
        <div class="drawer-section">
            <span class="drawer-section-label">Main</span>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="drawer-item"
                (click)="closeDrawer()">
                <span class="drawer-icon"><img src="assets/icons/dashaboard.png" alt="Dashboard" width="20" height="20" /></span>
                <span><span class="shortcut-hint">D</span>ashboard</span>
            </a>
            <a routerLink="/pipeline" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
                <span class="drawer-icon"><img src="assets/icons/pipe.png" alt="Pipeline" width="20" height="20" /></span>
                <span><span class="shortcut-hint">P</span>ipeline</span>
            </a>
            <a routerLink="/calendar" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
                <span class="drawer-icon"><img src="assets/icons/calender.png" alt="Calendar" width="20" height="20" /></span>
                <span><span class="shortcut-hint">C</span>alendar</span>
            </a>
        </div>

        <div class="drawer-section">
            <span class="drawer-section-label">Insights</span>
            <a routerLink="/analytics" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
                <span class="drawer-icon"><img src="assets/icons/analitics.png" alt="Analytics" width="20" height="20" /></span>
                <span><span class="shortcut-hint">A</span>nalytics</span>
            </a>
            <a routerLink="/coach-hub" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
                <span class="drawer-icon"><img src="assets/icons/hub.png" alt="Coach Hub" width="20" height="20" /></span>
                <span>Coach <span class="shortcut-hint">H</span>ub</span>
            </a>
            <a routerLink="/recruiters" routerLinkActive="active" class="drawer-item" (click)="closeDrawer()">
                <span class="drawer-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                <span><span class="shortcut-hint">R</span>ecruiters</span>
            </a>
        </div>

    </nav>

    <div class="drawer-footer">
        <button class="drawer-footer-btn settings" type="button" (click)="toggleSettings.emit(); closeDrawer()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24">
                </path>
            </svg>
            Settings
        </button>
        <button class="drawer-footer-btn logout" type="button" (click)="logout.emit()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Log out
        </button>
    </div>
</aside>

<!-- ═══ Bottom Tab Bar -mobile only ═══ -->
<nav *ngIf="isAuthenticated" class="bottom-tabbar" aria-label="Mobile navigation">
    <a routerLink="/" routerLinkActive="tab-active" [routerLinkActiveOptions]="{exact: true}" class="tab-item">
        <img src="assets/icons/dashaboard.png" alt="Dashboard" width="22" height="22" />
        <span><span class="shortcut-hint">D</span>ashboard</span>
    </a>
    <a routerLink="/pipeline" routerLinkActive="tab-active" class="tab-item">
        <img src="assets/icons/pipe.png" alt="Pipeline" width="22" height="22" />
        <span><span class="shortcut-hint">P</span>ipeline</span>
    </a>
    <a routerLink="/calendar" routerLinkActive="tab-active" class="tab-item">
        <img src="assets/icons/calender.png" alt="Calendar" width="22" height="22" />
        <span><span class="shortcut-hint">C</span>alendar</span>
    </a>
    <a routerLink="/analytics" routerLinkActive="tab-active" class="tab-item">
        <img src="assets/icons/analitics.png" alt="Analytics" width="22" height="22" />
        <span><span class="shortcut-hint">A</span>nalytics</span>
    </a>
    <button class="tab-item tab-more" type="button" (click)="toggleDrawer()" [class.tab-active]="drawerOpen"
        aria-label="More">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="5" cy="12" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
            <circle cx="19" cy="12" r="1" fill="currentColor"></circle>
        </svg>
        <span>More</span>
    </button>
</nav>
