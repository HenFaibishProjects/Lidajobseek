name: Pull Request Tests

on:
  pull_request:
    branches: [ "main", "private-hen" ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -w backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (services, guards, interceptors, utils)
        run: npm run test -w ui -- --watch=false --browsers=ChromeHeadlessNoSandbox --include="src/app/services/**/*.spec.ts" --include="src/app/guards/**/*.spec.ts" --include="src/app/interceptors/**/*.spec.ts" --include="src/app/utils/**/*.spec.ts"

      - name: Run unit tests (process-form component)
        run: npm run test -w ui -- --watch=false --browsers=ChromeHeadlessNoSandbox --include="src/app/components/process-form/**/*.spec.ts"

      - name: Run unit tests (remaining components and pages)
        run: npm run test -w ui -- --watch=false --browsers=ChromeHeadlessNoSandbox --include="src/app/app.component.spec.ts" --include="src/app/components/header/**/*.spec.ts" --include="src/app/components/settings-panel/**/*.spec.ts" --include="src/app/components/toast/**/*.spec.ts" --include="src/app/pages/**/*.spec.ts"

  test-docker-startup:
    name: Docker Startup Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create network
        run: docker network create test-net

      - name: Run infrastructure (Postgres)
        run: |
          docker run -d \
            --name db-test \
            --network test-net \
            -e POSTGRES_DB=jobtracker \
            -e POSTGRES_USER=jobtracker \
            -e POSTGRES_PASSWORD=jobtracker \
            postgres:16

          docker run -d \
            --name intelligence-db-test \
            --network test-net \
            -e POSTGRES_DB=company_intelligence \
            -e POSTGRES_USER=company_intelligence_user \
            -e POSTGRES_PASSWORD=company_intelligence_password \
            postgres:16

      - name: Build Docker image
        run: docker build -t lidajobseek:test .

      - name: Run Application
        run: |
          docker run -d \
            --name app-check \
            --network test-net \
            -e DATABASE_URL="postgresql://jobtracker:jobtracker@db-test:5432/jobtracker?sslmode=disable" \
            -e INTELLIGENCE_DB_HOST="intelligence-db-test" \
            -e INTELLIGENCE_DB_PORT="5432" \
            -e INTELLIGENCE_DB_USERNAME="company_intelligence_user" \
            -e INTELLIGENCE_DB_PASSWORD="company_intelligence_password" \
            -e INTELLIGENCE_DB_DATABASE="company_intelligence" \
            -e INTELLIGENCE_DB_SCHEMA="public" \
            -e INTELLIGENCE_DB_SSL="false" \
            -e INTELLIGENCE_ALLOWED_EMAIL="owner@example.com" \
            -e RECRUITER_GMAIL_POLLING_ENABLED="false" \
            -e GOOGLE_CLIENT_ID="test-client-id" \
            -e GOOGLE_CLIENT_SECRET="test-client-secret" \
            -e GOOGLE_REFRESH_TOKEN="test-refresh-token" \
            -e JWT_SECRET=${{ secrets.JWT_SECRET || 'test_secret' }} \
            -e REGISTER=${{ secrets.REGISTER || 'LIDA2026' }} \
            -e CI=true \
            -p 3000:3000 \
            lidajobseek:test

      - name: Wait for API to be ready
        run: |
          # The app might take a few seconds to start and connect to DB
          sleep 10
          timeout 60s sh -c 'until curl --silent --fail http://127.0.0.1:3000/api/health; do echo "Waiting for app..."; sleep 5; done' || (docker ps && docker logs app-check && curl -v http://127.0.0.1:3000/api/health && exit 1)

      - name: Smoke and Security Tests
        run: |
          chmod +x scripts/docker-smoke-test.sh
          ./scripts/docker-smoke-test.sh
        env:
          REGISTER: ${{ secrets.REGISTER || 'LIDA2026' }}

      - name: Cleanup
        if: always()
        run: |
          docker stop app-check db-test intelligence-db-test || true
          docker rm app-check db-test intelligence-db-test || true
          docker network rm test-net || true
