<div class="app-layout">
    <!-- Header Component -->
    <app-header
        *ngIf="showAppShell"
        [isAuthenticated]="isAuthenticated"
        [showSettings]="showSettings"
        (toggleSettings)="toggleSettings()"
        (logout)="logout()">
    </app-header>

    <!-- Main Content Area -->
    <main [class.app-main]="showAppShell" [class.app-main-no-sidebar]="!showAppShell">
        <div class="content-wrapper">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

<app-toast></app-toast>
<app-confirm-dialog></app-confirm-dialog>
<app-settings-panel *ngIf="showSettings && showAppShell" (close)="closeSettings()"></app-settings-panel>
<app-scroll-to-top *ngIf="showAppShell"></app-scroll-to-top>
<app-onboarding *ngIf="showOnboarding" (close)="closeOnboarding()"></app-onboarding>

<!-- Global AI Career Chat button -->
<button *ngIf="showAppShell" class="cc-float-btn" (click)="toggleCareerChat()" title="AI Career Chat">
    <lucide-icon name="sparkles" [size]="22" strokeWidth="2"></lucide-icon>
</button>

<!-- Global AI Career Chat panel -->
<app-career-chat-panel
    *ngIf="showCareerChat && showAppShell"
    (closed)="showCareerChat = false">
</app-career-chat-panel>
